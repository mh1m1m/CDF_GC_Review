name: Public-safe test suite

on:
  push:
    branches:
      - "fix/v712-fail-closed-cli"
      - "feature/v712-live-multi-agent-runtime"
      - "feature/v712-mat-professional-dna-agent"
      - "feature/v712-mat-human-calibration"
      - "development/v7.12-production-engineering"
  pull_request:
    branches:
      - "codex/stable-libreoffice"
      - "codex/takeover-audit-and-safeguards"
      - "feature/v712-mat-human-calibration"
      - "development/v7.12-production-engineering"
      - "feature/v712-live-multi-agent-runtime"
      - "feature/v712-mat-professional-dna-agent"
      - "main"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-safe-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CDF_AI_PROVIDER: ""            # no provider credentials in CI: live-inference tests are reported as skipped, never as passed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clean-environment install (pinned)
        run: python -m pip install -r requirements-visual.txt -r requirements-security.txt
      - name: Public repository confidential-content and credential guard
        run: python tools/mat_dna/public_repository_guard.py
      - name: Compile every module
        run: python -m compileall -q main.py migrate_to_v712.py cdf_gco_crms/ tools/ tests/ qa_public/
      - name: Public-safe suite (institutional-source tests skip with their reason)
        run: python -m pytest tests qa_public -q -p no:cacheprovider -rs --junitxml=build/junit-public.xml
      - name: Public-safe issuance policy (PR #2 unittest entry point)
        run: python -m unittest discover -s qa_public -p "test_*.py" -v
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-public
          path: build/junit-public.xml

  calibration-web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install UI packages
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Type-check and build Arabic RTL web UI
        working-directory: apps/web
        run: npm run build
      - name: Frontend contract tests
        working-directory: apps/web
        run: npm run test

  calibration-browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CDF_AI_PROVIDER: ""
      CDF_CALIBRATION_MODE: SYNTHETIC_LOCAL_DEV
      CDF_CALIBRATION_DB: build/private/mat-calibration-dev.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install private pilot development dependencies
        run: python -m pip install -r requirements-visual.txt
      - name: Generate ephemeral synthetic-only developer token
        run: echo "CDF_CALIBRATION_DEV_TOKEN=$(python -c 'import secrets; print(secrets.token_urlsafe(36))')" >> "$GITHUB_ENV"
      - name: Install shared Arabic test fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-core fonts-crosextra-carlito
      - name: Seed fictional local case
        run: |
          python tools/mat_dna/seed_calibration_demo.py --db build/private/mat-calibration-dev.sqlite
          python tools/seed_visual_demo.py --db build/private/mat-calibration-dev.sqlite
      - name: Start loopback-only calibration API
        run: |
          python -m uvicorn apps.api.main:app --host 127.0.0.1 --port 8765 > /tmp/mat-api.log 2>&1 &
          for n in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -80 /tmp/mat-api.log
          exit 1
      - name: Install UI packages
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Install Chromium for browser acceptance
        working-directory: apps/web
        run: npx playwright install chromium --with-deps
      - name: Browser acceptance on synthetic cases
        working-directory: apps/web
        run: npm run test:e2e

      - name: Synthetic browser screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-browser-screenshots
          path: apps/web/test-results/**/*.png

  visual-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audited runtime and security tools
        run: python -m pip install -r requirements-visual.txt -r requirements-security.txt
      - name: Public source and secret signature guard
        run: python tools/mat_dna/public_repository_guard.py
      - name: Static scan of new API and projection boundary
        run: |
          mkdir -p build/security
          python -m bandit -r cdf_gco_crms/intelligence apps/api -f json -o build/security/bandit.json
      - name: Audit runtime dependency advisory data
        run: python -m pip_audit -r requirements-visual.txt --vulnerability-service pypi --format json -o build/security/pip-audit.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit resolved frontend lockfile
        working-directory: apps/web
        run: npm audit --audit-level=low
      - name: Preserve security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-security-reports
          path: build/security/*.json
