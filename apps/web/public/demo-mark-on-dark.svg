  <text x="569.5" y="192" text-anchor="middle" font-family="Noto Sans, Arial, sans-serif" font-size="36" textLength="1020" lengthAdjust="spacingAndGlyphs" fill="#ffffff" fill-opacity="0.8">SYNTHETIC DEMO · NOT AN OFFICIAL DOCUMENT</text>
